<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Tryvo · Quay lại ứng dụng</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173a36;background:#f3faf8}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);padding:30px 22px;border-radius:24px;background:#fff;box-shadow:0 18px 50px #0f766e1f;text-align:center}
    .mark{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#ccfbf1;color:#0f766e;font-size:34px;font-weight:800}
    h1{font-size:24px;margin:0 0 10px}p{color:#526b67;line-height:1.5}
    button{width:100%;margin-top:14px;padding:14px 18px;border:0;border-radius:14px;background:#0f766e;color:#fff;font:inherit;font-weight:700}
    #error{color:#b42318;font-size:14px}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Đã hoàn tất kiểm tra</h1>
    <p>Đang quay lại Tryvo. Nếu ứng dụng chưa mở, hãy nhấn nút bên dưới.</p>
    <button id="openApp" type="button">Mở Tryvo</button>
    <p id="error"></p>
  </main>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const state = query.get('state') || '';
      const token = query.get('token') || '';
      const debug = query.get('client') === 'debug';
      const valid = /^[A-Za-z0-9_-]{32,128}$/.test(state) && /^[A-Za-z0-9._~-]{20,4096}$/.test(token);
      const error = document.getElementById('error');
      const button = document.getElementById('openApp');
      if (!valid) {
        button.hidden = true;
        error.textContent = 'Phiên xác minh không hợp lệ. Hãy quay lại Tryvo và thử lại.';
        return;
      }
      const packageName = debug ? 'com.vton.nativeapp.debug' : 'com.vton.nativeapp';
      const queryString = 'state=' + encodeURIComponent(state) + '&token=' + encodeURIComponent(token);
      const appUrl = 'intent://xuanmanh739512345.github.io/android/turnstile/callback/?' + queryString +
        '#Intent;scheme=https;package=' + packageName + ';end';
      const open = () => { location.href = appUrl; };
      button.addEventListener('click', open);
      setTimeout(open, 150);
    })();
  </script>
</body>
</html>
