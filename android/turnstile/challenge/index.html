<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Tryvo · Security verification</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173a36;background:#fff}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    body{display:flex;align-items:center;justify-content:center;padding:6px}
    main{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    h1,p{display:none}.cf-turnstile{display:flex;justify-content:center;width:100%}
    #error{display:block;margin:6px 8px 0;color:#b42318;font-size:12px;line-height:1.25}
  </style>
</head>
<body>
  <main>
    <h1>Security verification</h1>
    <p>Complete this security check to continue.</p>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAD-ybNFMeEaSHKdM" data-size="compact" data-theme="light" data-callback="done" data-error-callback="failed" data-expired-callback="failed"></div>
    <p id="error"></p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const state = q.get('state') || '';
    const client = q.get('client') === 'debug' ? '&client=debug' : '';
    function done(token) {
      if (!/^[A-Za-z0-9._~-]{20,4096}$/.test(token) || !/^[A-Za-z0-9_-]{32,128}$/.test(state)) { failed(); return; }
      location.replace('https://xuanmanh739512345.github.io/android/turnstile/callback/?state=' + encodeURIComponent(state) + '&token=' + encodeURIComponent(token) + client);
    }
    function failed() { document.getElementById('error').textContent = 'Verification failed. Reload and try again.'; }
  </script>
</body>
</html>
