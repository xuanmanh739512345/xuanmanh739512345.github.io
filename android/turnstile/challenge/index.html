<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tryvo · Kiểm tra bảo mật</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173a36;background:#f3faf8}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);padding:30px 22px;border-radius:24px;background:#fff;box-shadow:0 18px 50px #0f766e1f;text-align:center}h1{font-size:24px;margin:0 0 10px}p{color:#526b67;line-height:1.5}.cf-turnstile{display:flex;justify-content:center;margin-top:22px}#error{color:#b42318;font-size:14px}</style>
</head>
<body>
  <main>
    <h1>Xác minh bạn không phải robot</h1>
    <p>Hoàn tất kiểm tra bảo mật để tiếp tục đăng ký hoặc nhận mã OTP.</p>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAD-ybNFMeEaSHKdM" data-callback="done" data-error-callback="failed" data-expired-callback="failed"></div>
    <p id="error"></p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const state = q.get('state') || '';
    const client = q.get('client') === 'debug' ? '&client=debug' : '';
    function done(token) {
      if (!/^[A-Za-z0-9._~-]{20,4096}$/.test(token) || !/^[A-Za-z0-9_-]{32,128}$/.test(state)) { failed(); return; }
      location.replace('https://xuanmanh739512345.github.io/android/turnstile/callback/?state=' + encodeURIComponent(state) + '&token=' + encodeURIComponent(token) + client);
    }
    function failed() { document.getElementById('error').textContent = 'Không thể xác minh. Vui lòng tải lại và thử lại.'; }
  </script>
</body>
</html>
